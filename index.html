<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mở Hòm Món Ăn - Giao Diện Game</title>
    <style>
        :root {
            --bg-main: #19212b;
            --bg-card: #202732;
            --bg-card-hover: #2a3341;
            --color-primary: #7a9c46;
            --color-primary-hover: #8ab04f;
            --gold-border: #bba367;
            --text-main: #e2e5e9;
            --text-sub: #8b94a1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .case-container {
            width: 100%;
            max-width: 1000px;
            height: 180px; 
            background: #141a22;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        .center-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: #f1c40f;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 15px #f1c40f, 0 0 5px #f1c40f;
        }

        .case-track {
            display: flex;
            height: 100%;
            width: max-content;
        }

        .case-item {
            width: 200px; 
            min-width: 200px;
            height: 100%;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #242c38 0%, #151a22 100%);
            border-right: 1px solid #111;
            border-bottom: 6px solid transparent;
            box-sizing: border-box;
            padding: 15px;
            gap: 10px; 
        }

        .case-item img {
            width: 80px;
            height: 80px;
            object-fit: cover; 
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .case-item .name {
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .action-area {
            max-width: 1000px;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            background: #1e2630;
            padding: 20px;
            border-radius: 4px;
        }

        button.spin-btn {
            background: var(--color-primary);
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button.spin-btn::before {
            content: "⭐";
            font-size: 24px;
        }

        button.spin-btn:hover { background: var(--color-primary-hover); }
        button.spin-btn:active { transform: scale(0.98); }
        button.spin-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

        .inventory-section, .history-section {
            max-width: 1000px;
            margin: 0 auto 30px;
        }

        .inventory-section h2, .history-section h2 {
            font-size: 22px;
            font-weight: normal;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .item-card {
            background: var(--bg-card);
            border-radius: 4px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            transition: background 0.2s;
            border-bottom: 3px solid #555;
        }

        .item-card:hover { background: var(--bg-card-hover); }

        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(231, 76, 60, 0.8);
            color: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 2;
        }
        .item-card:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #e74c3c; }

        .img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            overflow: hidden;
            background: #1a1a1a;
            cursor: pointer;
            margin: 0 auto;
            width: 120px;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.2s;
        }

        .img-wrapper:hover img { opacity: 0.5; }
        
        .img-wrapper::after {
            content: "Đổi ảnh";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            color: white;
            opacity: 0;
            pointer-events: none;
        }
        .img-wrapper:hover::after { opacity: 1; }

        .item-card input.name-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            font-family: inherit;
            border-bottom: 1px dashed transparent;
        }
        .item-card input.name-input:focus {
            outline: none;
            border-bottom: 1px dashed #7a9c46;
        }

        .add-card {
            background: transparent;
            border: 2px dashed #444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            cursor: pointer;
            font-size: 40px;
            min-height: 200px;
            border-radius: 4px;
        }
        .add-card:hover { border-color: #666; color: #aaa; }

        /* --- LỊCH SỬ QUAY --- */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        .history-item {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            padding: 10px 15px;
            border-radius: 4px;
            gap: 15px;
            border-left: 4px solid transparent; /* Sẽ cập nhật theo độ hiếm */
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .history-item img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .history-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .history-info .name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .history-info .time {
            font-size: 12px;
            color: var(--text-sub);
        }

        .clear-btn {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid #e74c3c;
            padding: 6px 15px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .clear-btn:hover { background: #e74c3c; color: white; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 15, 20, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            border: 1px solid var(--gold-border);
            background: radial-gradient(circle, #25303f 0%, #171d26 100%);
            width: 90%;
            max-width: 600px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 32px;
            font-weight: normal;
            color: #fff;
            margin: 0 0 30px 0;
            text-align: center;
        }

        .modal-img-container {
            width: 250px;
            height: 250px;
            background: #111;
            margin-bottom: 40px;
            border-bottom: 4px solid var(--color-primary);
            position: relative;
        }

        .modal-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .modal-btn {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-continue {
            background: var(--color-primary);
            color: white;
        }
        .btn-continue:hover { background: var(--color-primary-hover); }

        .rarity-blue { border-bottom-color: #4b69ff !important; border-left-color: #4b69ff !important; }
        .rarity-purple { border-bottom-color: #8847ff !important; border-left-color: #8847ff !important; }
        .rarity-pink { border-bottom-color: #d32ce6 !important; border-left-color: #d32ce6 !important; }
        .rarity-red { border-bottom-color: #eb4b4b !important; border-left-color: #eb4b4b !important; }
        .rarity-gold { border-bottom-color: #e4ae39 !important; border-left-color: #e4ae39 !important; }

        @media (max-width: 600px) {
            .case-container { height: 140px; }
            .case-item { width: 150px; min-width: 150px; }
            .case-item img { width: 60px; height: 60px; }
            button.spin-btn { padding: 15px 40px; width: 100%; justify-content: center; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .modal-content { padding: 20px; }
            .modal-img-container { width: 180px; height: 180px; }
            .modal-title { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="case-container" id="caseContainer">
        <div class="center-line"></div>
        <div class="case-track" id="caseTrack"></div>
    </div>

    <div class="action-area">
        <button class="spin-btn" id="spinBtn">MỞ HÒM TIẾP</button>
    </div>

    <div class="inventory-section">
        <h2>Vật phẩm trong hòm</h2>
        <div class="grid-container" id="optionsContainer">
            <div class="add-card" id="addOptionBtn">+</div>
        </div>
    </div>

    <!-- KHU VỰC LỊCH SỬ QUAY -->
    <div class="history-section">
        <h2>
            Lịch sử quay
            <button class="clear-btn" id="clearHistoryBtn">Xóa lịch sử</button>
        </h2>
        <div class="history-list" id="historyList">
            <!-- Dữ liệu lịch sử sẽ được render vào đây -->
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle">Tên Món Ăn</h2>
            <div class="modal-img-container" id="modalRarityLine">
                <img id="modalImage" src="" alt="item">
            </div>
            <div class="modal-actions">
                <button class="modal-btn btn-continue" id="closeModalBtn">TIẾP TỤC</button>
            </div>
        </div>
    </div>

    <script>
        const caseTrack = document.getElementById('caseTrack');
        const caseContainer = document.getElementById('caseContainer');
        const spinBtn = document.getElementById('spinBtn');
        const optionsContainer = document.getElementById('optionsContainer');
        const addOptionBtn = document.getElementById('addOptionBtn');
        
        const resultModal = document.getElementById('resultModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalImage = document.getElementById('modalImage');
        const modalRarityLine = document.getElementById('modalRarityLine');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // History elements
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        const totalItems = 80;
        const winIndex = 70;
        const rarities = ['rarity-blue', 'rarity-purple', 'rarity-pink', 'rarity-red', 'rarity-gold'];
        const defaultIcon = 'https://cdn-icons-png.flaticon.com/512/3480/3480823.png';

        const tickSoundUrl = 'https://drive.google.com/uc?export=download&id=1aACqO6UolWxf3Y6fHk9YhrwzGEUwKVzt';
        const winSoundUrl = 'https://drive.google.com/uc?export=download&id=1ArX_eHGZgOXbnH7E7Gm_AUY7auykHZAz';
        
        const tickAudios = Array.from({ length: 5 }, () => new Audio(tickSoundUrl));
        let tickIndex = 0;
        const winAudio = new Audio(winSoundUrl);

        // Khởi tạo mảng lưu lịch sử từ LocalStorage (giữ lại kể cả khi f5 trang)
        let spinHistory = JSON.parse(localStorage.getItem('spinHistory')) || [];

        function renderHistory() {
            historyList.innerHTML = '';
            if (spinHistory.length === 0) {
                historyList.innerHTML = '<p style="color: var(--text-sub); text-align: center;">Chưa có lịch sử quay.</p>';
                return;
            }
            spinHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item ' + item.rarityClass;
                div.innerHTML = `
                    <img src="${item.img}" alt="history-item">
                    <div class="history-info">
                        <span class="name">${item.name}</span>
                        <span class="time">${item.time}</span>
                    </div>
                `;
                historyList.appendChild(div);
            });
        }

        clearHistoryBtn.addEventListener('click', () => {
            if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử?")) {
                spinHistory = [];
                localStorage.removeItem('spinHistory');
                renderHistory();
            }
        });

        function playTick() {
            const audio = tickAudios[tickIndex];
            audio.currentTime = 0;
            audio.volume = 0.5;
            audio.play().catch(e => {});
            tickIndex = (tickIndex + 1) % tickAudios.length;
        }

        function playWin() {
            winAudio.currentTime = 0;
            winAudio.volume = 1;
            winAudio.play().catch(e => {});
        }

        function createItemCard(name = "Món mới", imgSrc = defaultIcon) {
            const card = document.createElement('div');
            card.className = 'item-card ' + rarities[Math.floor(Math.random() * rarities.length)]; 
            
            card.innerHTML = `
                <button class="delete-btn" title="Xóa">X</button>
                <div class="img-wrapper">
                    <img src="${imgSrc}" class="preview-img" alt="preview">
                    <input type="file" accept="image/*" class="file-input" style="display:none;">
                </div>
                <input type="text" class="name-input" value="${name}" placeholder="...">
            `;

            const imgWrapper = card.querySelector('.img-wrapper');
            const fileInput = card.querySelector('.file-input');
            const previewImg = card.querySelector('.preview-img');

            imgWrapper.addEventListener('click', () => fileInput.click());
            
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    previewImg.src = URL.createObjectURL(file);
                }
            });

            card.querySelector('.delete-btn').addEventListener('click', () => {
                card.remove();
            });

            optionsContainer.insertBefore(card, addOptionBtn);
        }

        addOptionBtn.addEventListener('click', () => createItemCard(""));

        function getOptions() {
            const cards = document.querySelectorAll('.item-card');
            let opts = [];
            
            cards.forEach(card => {
                const name = card.querySelector('.name-input').value.trim();
                const img = card.querySelector('.preview-img').src;
                const rarityClass = Array.from(card.classList).find(c => c.startsWith('rarity-'));

                if (name !== "") {
                    opts.push({ name, img, rarityClass });
                }
            });

            if (opts.length === 0) return [{ name: "Trống", img: defaultIcon, rarityClass: 'rarity-blue' }];
            return opts;
        }

        function createTrackItemNode(itemData, overrideRarity = null) {
            const div = document.createElement('div');
            const rarity = overrideRarity || itemData.rarityClass || rarities[Math.floor(Math.random() * rarities.length)];
            div.className = 'case-item ' + rarity;
            
            const img = document.createElement('img');
            img.src = itemData.img; 
            img.onerror = function() { this.src = defaultIcon; };
            
            const span = document.createElement('span');
            span.className = 'name';
            span.innerText = itemData.name;
            
            div.appendChild(img);
            div.appendChild(span);
            return div;
        }

        function initTrack() {
            caseTrack.innerHTML = '';
            const opts = getOptions();
            for(let i = 0; i < 15; i++) {
                caseTrack.appendChild(createTrackItemNode(opts[Math.floor(Math.random() * opts.length)]));
            }
            caseTrack.style.transition = 'none';
            caseTrack.style.transform = `translateX(0px)`;
        }

        let isSpinning = false;

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerText = "ĐANG MỞ HÒM...";

            const opts = getOptions();
            caseTrack.innerHTML = '';
            caseTrack.style.transition = 'none';
            caseTrack.style.transform = `translateX(0px)`;

            // --- THUẬT TOÁN HACK TỈ LỆ ---
            const cheatRate = 0.60; // 70% cơ hội trúng
            let winningItem;
            
            const vipItem = opts.find(item => /\bny\b/i.test(item.name.trim()));

            if (vipItem && Math.random() < cheatRate) {
                winningItem = vipItem;
            } else {
                winningItem = opts[Math.floor(Math.random() * opts.length)];
            }
            // -----------------------------

            for(let i = 0; i < totalItems; i++) {
                if (i === winIndex) {
                    caseTrack.appendChild(createTrackItemNode(winningItem, winningItem.rarityClass));
                } else {
                    let randomItem = opts[Math.floor(Math.random() * opts.length)];
                    caseTrack.appendChild(createTrackItemNode(randomItem, rarities[Math.floor(Math.random() * rarities.length)]));
                }
            }

            void caseTrack.offsetWidth;

            const itemWidth = caseTrack.children[0].offsetWidth;
            const containerWidth = caseContainer.offsetWidth;
            
            const offset = (Math.random() * (itemWidth - 30)) - ((itemWidth - 30) / 2);
            const targetX = (winIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2) + offset;

            caseTrack.style.transition = 'transform 6.5s cubic-bezier(0.08, 0.6, 0.1, 1)';
            caseTrack.style.transform = `translateX(-${targetX}px)`;

            let lastItemIndex = -1;
            let checkPosition;

            function trackPosition() {
                if (!isSpinning) return;
                
                const style = window.getComputedStyle(caseTrack);
                const matrix = new DOMMatrixReadOnly(style.transform);
                const currentX = Math.abs(matrix.m41);

                const currentItemIndex = Math.floor((currentX + (containerWidth / 2)) / itemWidth);

                if (currentItemIndex !== lastItemIndex && currentItemIndex < totalItems && currentItemIndex >= 0) {
                    if (lastItemIndex !== -1) playTick();
                    lastItemIndex = currentItemIndex;
                }
                checkPosition = requestAnimationFrame(trackPosition);
            }

            requestAnimationFrame(trackPosition);

            setTimeout(() => {
                isSpinning = false;
                cancelAnimationFrame(checkPosition);
                playWin();
                
                // Cập nhật giao diện Modal
                modalTitle.innerText = winningItem.name;
                modalImage.src = winningItem.img;
                modalRarityLine.className = 'modal-img-container ' + winningItem.rarityClass;
                resultModal.classList.add('show');
                
                // Cập nhật Lịch Sử Quay
                const now = new Date();
                const timeString = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                spinHistory.unshift({
                    name: winningItem.name,
                    img: winningItem.img,
                    rarityClass: winningItem.rarityClass,
                    time: timeString
                });
                
                // Giới hạn lưu 30 kết quả gần nhất để tránh lag
                if (spinHistory.length > 30) spinHistory.pop();
                
                // Lưu vào LocalStorage
                localStorage.setItem('spinHistory', JSON.stringify(spinHistory));
                renderHistory();

                spinBtn.disabled = false;
                spinBtn.innerHTML = "MỞ HÒM TIẾP";
            }, 6600);
        }

        spinBtn.addEventListener('click', () => {
            tickAudios.forEach(audio => {
                audio.volume = 0;
                audio.play().then(() => {
                    audio.pause(); audio.volume = 0.5; audio.currentTime = 0;
                }).catch(e => {});
            });
            winAudio.volume = 0;
            winAudio.play().then(() => {
                winAudio.pause(); winAudio.volume = 1; winAudio.currentTime = 0;
            }).catch(e => {});
            
            spin();
        });

        closeModalBtn.addEventListener('click', () => {
            resultModal.classList.remove('show');
        });
        
        // Khởi tạo các item ban đầu
        createItemCard("Nguyên Bê", "https://cdn-icons-png.flaticon.com/512/3480/3480823.png");
        createItemCard("Đức Anh", "https://cdn-icons-png.flaticon.com/512/3480/3480823.png");
        createItemCard("Huy Chim", "https://cdn-icons-png.flaticon.com/512/3480/3480823.png");
        createItemCard("Đức Nam", "https://cdn-icons-png.flaticon.com/512/3480/3480823.png");
        createItemCard("Đậu Nam", "https://cdn-icons-png.flaticon.com/512/3480/3480823.png");
        createItemCard("Công ngu", "https://cdn-icons-png.flaticon.com/512/3480/3480823.png");
        createItemCard("Thanhf", "https://cdn-icons-png.flaticon.com/512/3480/3480823.png");
        createItemCard("Kềnh", "https://cdn-icons-png.flaticon.com/512/3480/3480823.png");
        createItemCard("NY Thư", "https://cdn-icons-png.flaticon.com/512/3480/3480823.png");
        
        // Gọi render lịch sử lần đầu khi trang load
        renderHistory();
        setTimeout(initTrack, 100);
    </script>
</body>
</html>
