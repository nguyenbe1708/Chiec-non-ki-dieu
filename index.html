<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mở Hòm Món Ăn - Upload Ảnh Local</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #f39c12;
            margin-bottom: 5px;
            font-size: 2rem;
        }

        .header p {
            font-size: 0.9rem;
            color: #aaa;
        }

        /* Container của thanh trượt */
        .case-container {
            width: 100%;
            max-width: 900px;
            height: 120px; 
            background: #1e1e1e;
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
            border-radius: 6px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        .center-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: #f1c40f;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 10px #f1c40f;
        }

        .case-track {
            display: flex;
            height: 100%;
            width: max-content;
        }

        /* Giao diện Ô mở hòm */
        .case-item {
            width: 240px; 
            min-width: 240px;
            height: 100%;
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: flex-start;
            background: linear-gradient(180deg, #2a2a2a 0%, #151515 100%);
            border-right: 1px solid #000;
            border-bottom: 6px solid #5e98d9;
            box-sizing: border-box;
            padding: 0 15px;
            gap: 15px; 
        }

        .case-item img {
            width: 50px;
            height: 50px;
            object-fit: cover; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .case-item .name {
            font-size: 16px;
            font-weight: bold;
            color: #eee;
            word-wrap: break-word;
            text-align: left;
            flex: 1; 
            line-height: 1.3;
        }

        /* Vùng điều khiển */
        .controls-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 900px;
            flex-wrap: wrap; 
        }

        .data-input {
            flex: 1;
            min-width: 320px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .data-input h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #f39c12;
            font-size: 1.1rem;
        }

        /* Danh sách tùy chỉnh món ăn */
        #optionsContainer {
            max-height: 250px; 
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
        }

        #optionsContainer::-webkit-scrollbar { width: 6px; }
        #optionsContainer::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        .option-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #2a2a2a;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .option-row .preview-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            background: #444;
        }

        .option-row input[type="text"] {
            flex: 1;
            background: #1e1e1e;
            color: white;
            border: 1px solid #444;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 14px;
        }

        .option-row .upload-btn {
            background: #3498db;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .option-row .upload-btn:hover { background: #2980b9; }

        .option-row .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .option-row .delete-btn:hover { background: #c0392b; }

        .add-row-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .add-row-btn:hover { background: #27ae60; }

        .action-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-width: 280px;
        }

        button.spin-btn {
            background: linear-gradient(90deg, #e67e22, #f39c12);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            text-transform: uppercase;
            width: 100%; 
            max-width: 300px;
            transition: all 0.2s;
        }

        button.spin-btn:active { transform: scale(0.95); }
        button.spin-btn:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; }

        /* --- HIỆU ỨNG XUẤT HIỆN KẾT QUẢ --- */
        #result {
            margin-top: 20px;
            font-size: 28px; /* Làm chữ to hơn một chút */
            font-weight: bold;
            color: #2ecc71;
            text-align: center;
            min-height: 40px;
            opacity: 0; /* Ẩn đi khi chưa quay xong */
            transform: scale(0.5);
        }

        .show-result {
            /* Animation nảy lên */
            animation: popUpGlow 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUpGlow {
            0% { 
                transform: scale(0.5) translateY(20px); 
                opacity: 0; 
                text-shadow: none;
            }
            70% { 
                transform: scale(1.1) translateY(-5px); 
                opacity: 1; 
                text-shadow: 0 0 20px rgba(46, 204, 113, 0.8);
            }
            100% { 
                transform: scale(1) translateY(0); 
                opacity: 1; 
                text-shadow: 0 0 15px rgba(46, 204, 113, 0.6); /* Sáng neon */
            }
        }
        /* --------------------------------- */

        /* CSS Responsive cho Điện thoại */
        @media (max-width: 600px) {
            .case-container { height: 100px; }
            .case-item { width: 200px; min-width: 200px; padding: 0 10px; gap: 10px; }
            .case-item img { width: 40px; height: 40px; }
            .case-item .name { font-size: 14px; }
            button.spin-btn { font-size: 18px; padding: 12px; }
            .option-row input[type="text"] { width: 80px; } 
            .option-row .upload-btn { padding: 8px; font-size: 11px;}
            #result { font-size: 24px; }
        }

        .rarity-blue { border-bottom-color: #4b69ff; }
        .rarity-purple { border-bottom-color: #8847ff; }
        .rarity-pink { border-bottom-color: #d32ce6; }
        .rarity-red { border-bottom-color: #eb4b4b; }
        .rarity-gold { border-bottom-color: #e4ae39; }

    </style>
</head>
<body>

    <div class="header">
        <h1>Trưa Nay Ăn Gì?</h1>
        <p>Tải trực tiếp ảnh của bạn lên từ Thư viện máy</p>
    </div>

    <div class="case-container" id="caseContainer">
        <div class="center-line"></div>
        <div class="case-track" id="caseTrack"></div>
    </div>

    <div class="controls-container">
        <div class="data-input">
            <h3>Quản lý món ăn:</h3>
            <div id="optionsContainer"></div>
            <button class="add-row-btn" id="addOptionBtn">+ THÊM LỰA CHỌN MỚI</button>
        </div>

        <div class="action-area">
            <button class="spin-btn" id="spinBtn">MỞ HÒM!</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const caseTrack = document.getElementById('caseTrack');
        const caseContainer = document.getElementById('caseContainer');
        const spinBtn = document.getElementById('spinBtn');
        const resultDiv = document.getElementById('result');
        const optionsContainer = document.getElementById('optionsContainer');
        const addOptionBtn = document.getElementById('addOptionBtn');

        const totalItems = 80;
        const winIndex = 70;
        const rarities = ['rarity-blue', 'rarity-purple', 'rarity-pink', 'rarity-red', 'rarity-gold'];
        const defaultIcon = 'https://cdn-icons-png.flaticon.com/512/3480/3480823.png';

        const tickSoundUrl = 'https://drive.google.com/uc?export=download&id=1aACqO6UolWxf3Y6fHk9YhrwzGEUwKVzt';
        const winSoundUrl = 'https://drive.google.com/uc?export=download&id=1ArX_eHGZgOXbnH7E7Gm_AUY7auykHZAz';
        
        const tickAudios = Array.from({ length: 5 }, () => new Audio(tickSoundUrl));
        let tickIndex = 0;
        const winAudio = new Audio(winSoundUrl);

        function playTick() {
            const audio = tickAudios[tickIndex];
            audio.currentTime = 0;
            audio.volume = 0.5;
            audio.play().catch(e => {});
            tickIndex = (tickIndex + 1) % tickAudios.length;
        }

        function playWin() {
            winAudio.currentTime = 0;
            winAudio.volume = 1;
            winAudio.play().catch(e => {});
        }

        function createOptionRow(name = "", imgSrc = defaultIcon) {
            const row = document.createElement('div');
            row.className = 'option-row';
            
            row.innerHTML = `
                <img src="${imgSrc}" class="preview-img" alt="preview">
                <input type="text" class="name-input" value="${name}" placeholder="Tên món...">
                <label class="upload-btn">
                    Tải ảnh
                    <input type="file" accept="image/*" class="file-input" style="display:none;">
                </label>
                <button class="delete-btn">X</button>
            `;

            const fileInput = row.querySelector('.file-input');
            const previewImg = row.querySelector('.preview-img');
            
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const objectUrl = URL.createObjectURL(file);
                    previewImg.src = objectUrl;
                }
            });

            row.querySelector('.delete-btn').addEventListener('click', () => {
                row.remove();
            });

            optionsContainer.appendChild(row);
        }

        addOptionBtn.addEventListener('click', () => createOptionRow());

        function getOptions() {
            const rows = document.querySelectorAll('.option-row');
            let opts = [];
            
            rows.forEach(row => {
                const name = row.querySelector('.name-input').value.trim();
                const img = row.querySelector('.preview-img').src;
                if (name !== "") {
                    opts.push({ name: name, img: img });
                }
            });

            if (opts.length === 0) return [{ name: "Chưa nhập món", img: defaultIcon }];
            return opts;
        }

        function createItemNode(itemData) {
            const div = document.createElement('div');
            div.className = 'case-item ' + rarities[Math.floor(Math.random() * rarities.length)];
            
            const img = document.createElement('img');
            img.src = itemData.img; 
            img.onerror = function() { this.src = defaultIcon; };
            
            const span = document.createElement('span');
            span.className = 'name';
            span.innerText = itemData.name;
            
            div.appendChild(img);
            div.appendChild(span);
            return div;
        }

        function initTrack() {
            caseTrack.innerHTML = '';
            const opts = getOptions();
            for(let i = 0; i < 15; i++) {
                caseTrack.appendChild(createItemNode(opts[Math.floor(Math.random() * opts.length)]));
            }
            caseTrack.style.transition = 'none';
            caseTrack.style.transform = `translateX(0px)`;
        }

        let isSpinning = false;

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerText = "ĐANG MỞ...";
            
            // Ẩn kết quả cũ đi để chuẩn bị cho hiệu ứng mới
            resultDiv.classList.remove('show-result');
            resultDiv.innerText = "";

            const opts = getOptions();
            caseTrack.innerHTML = '';
            caseTrack.style.transition = 'none';
            caseTrack.style.transform = `translateX(0px)`;

            const winningItem = opts[Math.floor(Math.random() * opts.length)];

            for(let i = 0; i < totalItems; i++) {
                if (i === winIndex) {
                    caseTrack.appendChild(createItemNode(winningItem));
                } else {
                    caseTrack.appendChild(createItemNode(opts[Math.floor(Math.random() * opts.length)]));
                }
            }

            void caseTrack.offsetWidth;

            const itemWidth = caseTrack.children[0].offsetWidth;
            const containerWidth = caseContainer.offsetWidth;
            
            const offset = (Math.random() * (itemWidth - 30)) - ((itemWidth - 30) / 2);
            const targetX = (winIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2) + offset;

            caseTrack.style.transition = 'transform 6.5s cubic-bezier(0.08, 0.6, 0.1, 1)';
            caseTrack.style.transform = `translateX(-${targetX}px)`;

            let lastItemIndex = -1;
            let checkPosition;

            function trackPosition() {
                if (!isSpinning) return;
                
                const style = window.getComputedStyle(caseTrack);
                const matrix = new DOMMatrixReadOnly(style.transform);
                const currentX = Math.abs(matrix.m41);

                const currentItemIndex = Math.floor((currentX + (containerWidth / 2)) / itemWidth);

                if (currentItemIndex !== lastItemIndex && currentItemIndex < totalItems && currentItemIndex >= 0) {
                    if (lastItemIndex !== -1) { 
                        playTick();
                    }
                    lastItemIndex = currentItemIndex;
                }
                checkPosition = requestAnimationFrame(trackPosition);
            }

            requestAnimationFrame(trackPosition);

            setTimeout(() => {
                isSpinning = false;
                cancelAnimationFrame(checkPosition);
                playWin();
                
                // Kích hoạt hiệu ứng xuất hiện kết quả
                resultDiv.innerHTML = "🎉 " + winningItem.name + " 🎉";
                resultDiv.classList.add('show-result');
                
                spinBtn.disabled = false;
                spinBtn.innerText = "MỞ LẠI";
            }, 6600);
        }

        spinBtn.addEventListener('click', () => {
            tickAudios.forEach(audio => {
                audio.volume = 0;
                audio.play().then(() => {
                    audio.pause();
                    audio.volume = 0.5;
                    audio.currentTime = 0;
                }).catch(e => {});
            });

            winAudio.volume = 0;
            winAudio.play().then(() => {
                winAudio.pause();
                winAudio.volume = 1;
                winAudio.currentTime = 0;
            }).catch(e => {});
            
            spin();
        });
        
        createOptionRow("Cơm Tấm");
        createOptionRow("Bún Bò Huế");
        createOptionRow("KFC");
        createOptionRow("Bún Đậu Mắm Tôm");
        
        setTimeout(initTrack, 100);
    </script>
</body>
</html>
